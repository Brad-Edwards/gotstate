name: Feature request
description: Propose a capability of the library.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: Need
      description: The task that you cannot do with the library now.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: The behavior that meets the need.
    validations:
      required: true
