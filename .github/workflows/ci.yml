name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.0
          install: false
      - run: make tools
      - name: File hygiene, workflow and secret checks
        run: mise exec -- uv run --locked --no-build pre-commit run --all-files
      - name: Run all repository checks and tests
        env:
          BASE_REF: ${{ github.base_ref }}
        run: make ci-check
      - name: Keep the inputs that fuzz targets found
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-inputs
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore
      - name: Run the SonarQube Cloud analysis
        if: >-
          github.actor != 'dependabot[bot]'
          && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  codeql:
    # Approved exception: actionlint v1.7.12 rejects the newer $/ syntax.
    uses: ./.github/workflows/codeql.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      security-events: write
      actions: read

  validate:
    name: Validate
    needs: [checks, codeql]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require repository checks and CodeQL completion
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          CODEQL_COMPLETION: ${{ needs.codeql.outputs.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$CODEQL_RESULT" = success
          test "$CODEQL_COMPLETION" = success
