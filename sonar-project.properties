sonar.projectKey=Brad-Edwards_gotstate
sonar.organization=brad-edwards
sonar.projectName=gotstate

# The gate of the project fails on any new issue.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600

sonar.sources=.
sonar.exclusions=**/*_test.go,**/testdata/**,tools/**,.cache/**,.venv/**,site/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.go.coverage.reportPaths=.cache/coverage.out
