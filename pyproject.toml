# pyproject.toml
[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "gotstate"
version = "2.0.0"  # Major version bump for breaking change
description = "A Pythonic UML-compliant Hierarchical Finite State Machine (HFSM) library"
readme = "README.md"
authors = ["Brad Edwards <brad@keplerops.com>"]
license = "MIT"
repository = "https://github.com/Brad-Edwards/gotstate"
documentation = "https://github.com/Brad-Edwards/gotstate#readme"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["state-machine", "hsm", "finite-state-machine", "hierarchical-state-machine", "uml"]
packages = [{include = "gotstate"}]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
typing-extensions = "^4.12.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.25.0"
pytest-cov = "^4.1.0"
coverage = "^7.0.0"
black = "^24.1.0"
isort = "^5.13.0"
flake8 = "^7.0.0"
mypy = "^1.13.0"
bandit = "^1.7.7"
safety = "^3.0.0"

[tool.black]
line-length = 120
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
^/tests/fixtures
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip = [
    "tests/fixtures",
    "__init__.py",
    "setup.py",
    ".venv",
    "venv",
    "env",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
    ".tox",
    ".pytest_cache"
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q -v --cov=gotstate --cov-report=term-missing:skip-covered --cov-report=html --cov-report=xml"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["gotstate"]
branch = true
omit = [
    "tests/*",
    "*/__init__.py",
    "setup.py",
    "*/.venv/*",
    "*/venv/*",
    "*/env/*",
    "*/__pycache__/*",
    "*/build/*",
    "*/dist/*",
    "*/.eggs/*",
    "*/.tox/*",
    "*/.pytest_cache/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
    "def main\\(\\):",
    "@abstract"
]
fail_under = 80
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "coverage-reports/html"

[tool.coverage.xml]
output = "coverage-reports/coverage.xml"

[tool.bandit]
exclude_dirs = ["tests/**"]
skips = ["B101"]  # Skip assert warnings globally
targets = ["gotstate"]
